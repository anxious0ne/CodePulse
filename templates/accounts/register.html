<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePulse — Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700/60 p-8 space-y-6">
        <!-- Logo Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-sky-400 text-white shadow-lg shadow-indigo-500/30 mb-2">
                <i class="fa-solid fa-bolt text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                Create Account
            </h1>
            <p class="text-sm text-slate-400">Join CodePulse and track your CP journey</p>
        </div>

        {% if errors %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl p-3 space-y-1">
            {% for err in errors %}
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-xs flex-shrink-0"></i>
                <span>{{ err }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'register-direct' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" value="{{ username|default:'' }}" required
                        class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        placeholder="john_coder">
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" value="{{ email|default:'' }}"
                        class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        placeholder="john@example.com">
                </div>
            </div>

            <div>
                <label for="codeforces_handle" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Codeforces Handle <span class="text-slate-500 font-normal lowercase">(optional)</span></label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-chart-line"></i>
                    </span>
                    <input type="text" id="codeforces_handle" name="codeforces_handle" value="{{ codeforces_handle|default:'' }}"
                        class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        placeholder="tourist, Benq...">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password *</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        placeholder="••••••••">
                </div>
                <div>
                    <label for="confirm_password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Confirm *</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                        class="w-full px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-sky-500 hover:from-indigo-600 hover:to-sky-600 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0 mt-2">
                Register & Start Tracking
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-700/60">
            <p class="text-sm text-slate-400">
                Already registered? 
                <a href="{% url 'login-direct' %}" class="text-sky-400 hover:text-sky-300 font-semibold ml-1">Sign In</a>
            </p>
        </div>
    </div>

</body>
</html>
